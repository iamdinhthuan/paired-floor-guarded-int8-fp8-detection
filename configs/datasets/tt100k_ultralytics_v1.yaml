download: "import json\nimport shutil\nfrom pathlib import Path\n\nfrom PIL import
  Image\n\nfrom ultralytics.utils import TQDM\nfrom ultralytics.utils.downloads import
  download\n\n\ndef tt100k2yolo(dir):\n    \"\"\"Convert TT100K annotations to YOLO
  format with images/{split} and labels/{split} structure.\"\"\"\n    data_dir = dir
  / \"data\"\n    anno_file = data_dir / \"annotations.json\"\n\n    print(\"Loading
  annotations...\")\n    with open(anno_file, encoding=\"utf-8\") as f:\n        data
  = json.load(f)\n\n    # Build class name to index mapping from yaml\n    names =
  yaml[\"names\"]\n    class_to_idx = {v: k for k, v in names.items()}\n\n    # Create
  directories\n    for split in [\"train\", \"val\", \"test\"]:\n        (dir / \"images\"
  / split).mkdir(parents=True, exist_ok=True)\n        (dir / \"labels\" / split).mkdir(parents=True,
  exist_ok=True)\n\n    print(\"Converting annotations to YOLO format...\")\n    skipped
  = 0\n    for img_id, img_data in TQDM(data[\"imgs\"].items(), desc=\"Processing\"):\n
  \       img_path_str = img_data[\"path\"]\n        if \"train\" in img_path_str:\n
  \           split = \"train\"\n        elif \"test\" in img_path_str:\n            split
  = \"test\"\n        else:\n            split = \"val\"\n\n        # Source and destination
  paths\n        src_img = data_dir / img_path_str\n        if not src_img.exists():\n
  \           continue\n\n        dst_img = dir / \"images\" / split / src_img.name\n\n
  \       # Get image dimensions\n        try:\n            with Image.open(src_img)
  as img:\n                img_width, img_height = img.size\n        except Exception
  as e:\n            print(f\"Error reading {src_img}: {e}\")\n            continue\n\n
  \       # Copy image to destination\n        shutil.copy2(src_img, dst_img)\n\n
  \       # Convert annotations\n        label_file = dir / \"labels\" / split / f\"{src_img.stem}.txt\"\n
  \       lines = []\n\n        for obj in img_data.get(\"objects\", []):\n            category
  = obj[\"category\"]\n            if category not in class_to_idx:\n                skipped
  += 1\n                continue\n\n            bbox = obj[\"bbox\"]\n            xmin,
  ymin = bbox[\"xmin\"], bbox[\"ymin\"]\n            xmax, ymax = bbox[\"xmax\"],
  bbox[\"ymax\"]\n\n            # Convert to YOLO format (normalized center coordinates
  and dimensions)\n            x_center = ((xmin + xmax) / 2.0) / img_width\n            y_center
  = ((ymin + ymax) / 2.0) / img_height\n            width = (xmax - xmin) / img_width\n
  \           height = (ymax - ymin) / img_height\n\n            # Clip to valid range\n
  \           x_center = max(0, min(1, x_center))\n            y_center = max(0, min(1,
  y_center))\n            width = max(0, min(1, width))\n            height = max(0,
  min(1, height))\n\n            cls_idx = class_to_idx[category]\n            lines.append(f\"{cls_idx}
  {x_center:.6f} {y_center:.6f} {width:.6f} {height:.6f}\\n\")\n\n        # Write
  label file\n        if lines:\n            label_file.write_text(\"\".join(lines),
  encoding=\"utf-8\")\n\n    if skipped:\n        print(f\"Skipped {skipped} annotations
  with unknown categories\")\n    print(\"Conversion complete!\")\n\n\n# Download\ndir
  = Path(yaml[\"path\"])  # dataset root dir\nurls = [\"https://cg.cs.tsinghua.edu.cn/traffic-sign/data_model_code/data.zip\"]\ndownload(urls,
  dir=dir, curl=True, threads=1)\n\n# Convert\ntt100k2yolo(dir)\n"
