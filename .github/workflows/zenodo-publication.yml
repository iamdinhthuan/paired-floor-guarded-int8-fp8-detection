name: Zenodo publication

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Credential-free probe or resume the approved existing deposit
        type: choice
        options:
          - probe
          - publish
        default: probe
      attempts:
        description: Maximum publication attempts (1–12, five-minute backoff)
        default: '6'
        type: string

permissions:
  contents: read

concurrency:
  group: zenodo-22664869
  cancel-in-progress: false

jobs:
  connectivity:
    if: inputs.operation != 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Zenodo from a GitHub-hosted runner (no credentials)
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          url = 'https://zenodo.org/api/records/22275640'
          with urllib.request.urlopen(url, timeout=45) as response:
              record = json.load(response)
          assert str(record['id']) == '22275640'
          print('Zenodo public API reachable; prior record verified.')
          PY

  publish:
    if: inputs.operation == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install publication client dependency (before exposing Zenodo secret)
        run: python3 -m pip install requests==2.32.5
      - name: Download the frozen transfer assets and verify all SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/publish_zenodo_archive.py
          --plan .github/zenodo-v2.2.0.json
          --download-only
      - name: Resume, verify all ten files, and publish existing Zenodo draft
        env:
          ZENODO_PUBLICATION_TOKEN: ${{ secrets.ZENODO_PUBLICATION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ATTEMPTS: ${{ inputs.attempts }}
          PYTHONUNBUFFERED: '1'
        run: >-
          python3 scripts/publish_zenodo_archive.py
          --plan .github/zenodo-v2.2.0.json
          --attempts "$ATTEMPTS"
          --retry-delay 300
          --publish
